<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaVest - Register</title>
    <style>
        :root {
            --neon-green: #00ff9d;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #a0b3a8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(rgba(0, 10, 5, 0.85), rgba(0, 20, 10, 0.95)), url('https://z-cdn-media.chatglm.cn/files/30f841e2-4ea1-4faf-92ad-2d6414f456fc.png?auth_key=1885159136-9a4e205a52a1464fa2bf77391a919237-0-3ee60c15e334df9b53f98c4d12ca888e') no-repeat center center fixed; 
            background-size: cover;
            color: var(--text-main); 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .logo { font-size: 32px; font-weight: 800; color: var(--neon-green); text-shadow: 0 0 15px rgba(0, 255, 157, 0.4); margin-bottom: 20px; }

        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            padding: 30px;
            width: 100%;
            max-width: 400px;
        }

        h2 { text-align: center; color: var(--text-main); margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-muted); font-size: 14px; }
        input { 
            width: 100%; padding: 12px; border-radius: 8px; font-size: 16px; 
            background: rgba(0, 0, 0, 0.3); 
            border: 1px solid var(--glass-border); 
            color: var(--text-main); 
            transition: 0.2s;
        }
        input:focus { border-color: var(--neon-green); outline: none; box-shadow: 0 0 10px rgba(0, 255, 157, 0.2); }
        .btn { width: 100%; background: var(--neon-green); color: #000; padding: 14px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 16px; transition: 0.2s; margin-top: 10px; }
        .btn:hover { box-shadow: 0 0 20px rgba(0, 255, 157, 0.4); }
        .links { text-align: center; margin-top: 20px; font-size: 14px; color: var(--text-muted); }
        .links a { color: var(--neon-green); font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <div class="logo">NovaVest</div>
    <div class="glass-container">
        <h2>Create Your Account</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="e.g. John Doe" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="e.g. john@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a strong password (min 6 chars)" required>
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>
        <div class="links">Already have an account? <a href="login.html">Login here</a></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDnCejfQcvxQjcb3JESNPvZJpGgwbZy9bY",
            authDomain: "novavest-58ae5.firebaseapp.com",
            databaseURL: "https://novavest-58ae5-default-rtdb.firebaseio.com/",
            projectId: "novavest-58ae5",
            storageBucket: "novavest-58ae5.firebasestorage.app",
            messagingSenderId: "596912273946",
            appId: "1:596912273946:web:50fdb479fbc088a9392fa3"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            let name = document.getElementById('fullname').value;
            let email = document.getElementById('email').value;
            let password = document.getElementById('password').value;
            let safeEmail = email.replace(/\./g, ',');

            const urlParams = new URLSearchParams(window.location.search);
            let referrer = urlParams.get('ref') || "None";
            
            auth.createUserWithEmailAndPassword(email, password)
            .then((userCredential) => {
                db.ref('users/' + safeEmail).set({
                    fullname: name,
                    email: email,
                    balance: 0,
                    tier: "None",
                    referredBy: referrer
                }).then(() => {
                    localStorage.setItem('novavestUser', name);
                    localStorage.setItem('novavestEmail', email);
                    window.location.href = "dashboard.html";
                });
            })
            .catch((error) => {
                alert("Error: " + error.message);
            });
        });
    </script>
</body>
</html>
