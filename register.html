<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaVest - Register</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #f4f8f6; color: #1a1a1a; padding: 20px; }
        header { text-align: center; margin-bottom: 30px; }
        .logo { font-size: 32px; font-weight: 800; color: #00a86b; }
        .form-container { max-width: 420px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid #00a86b; }
        h2 { text-align: center; color: #1a1a1a; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        input:focus { border-color: #00a86b; outline: none; }
        .btn { width: 100%; background-color: #00a86b; color: white; padding: 14px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 16px; }
        .btn:hover { background-color: #007a4d; }
        .login-link { text-align: center; margin-top: 15px; font-size: 14px; color: #666; }
        .login-link a { color: #00a86b; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <header><div class="logo">NovaVest</div></header>
    <div class="form-container">
        <h2>Create Your Account</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="e.g. John Doe" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="e.g. john@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a strong password" required>
            </div>
            <button type="submit" class="btn">Create Account</button>
        </form>
        <div class="login-link">Already have an account? <a href="login.html">Login here</a></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDnCejfQcvxQjcb3JESNPvZJpGgwbZy9bY",
            authDomain: "novavest-58ae5.firebaseapp.com",
            databaseURL: "https://novavest-58ae5-default-rtdb.firebaseio.com/",
            projectId: "novavest-58ae5",
            storageBucket: "novavest-58ae5.firebasestorage.app",
            messagingSenderId: "596912273946",
            appId: "1:596912273946:web:50fdb479fbc088a9392fa3"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            let name = document.getElementById('fullname').value;
            let email = document.getElementById('email').value;
            let safeEmail = email.replace(/\./g, ',');

            // Check URL to see if someone referred them
            const urlParams = new URLSearchParams(window.location.search);
            let referrer = urlParams.get('ref') || "None";
            
            db.ref('users/' + safeEmail).set({
                fullname: name,
                email: email,
                balance: 0,
                tier: "None",
                referredBy: referrer // Save the referrer!
            }).then(() => {
                localStorage.setItem('novavestUser', name);
                localStorage.setItem('novavestEmail', email);
                alert("Account created successfully! Welcome to NovaVest.");
                window.location.href = "dashboard.html";
            }).catch((error) => {
                alert("Error: " + error.message);
            });
        });
    </script>
</body>
</html>
