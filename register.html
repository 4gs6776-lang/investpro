<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaVest - Register</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .terms-checkbox { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 20px; }
        .terms-checkbox input { width: auto; margin-top: 5px; }
        .terms-checkbox label { color: var(--text-muted); font-size: 14px; }
        .terms-checkbox a { color: var(--neon-main); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
    <div class="logo">NovaVest</div>
    <div class="glass-container" style="padding: 30px; width: 100%; max-width: 400px;">
        <h2>Create Your Account</h2>
        <form id="registerForm">
            <div class="form-group"><label>Full Name</label><input type="text" id="fullname" placeholder="e.g. John Doe" required></div>
            <div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="e.g. john@example.com" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Min 6 characters" required></div>
            
            <!-- NEW: Terms and Conditions Checkbox -->
            <div class="terms-checkbox">
                <input type="checkbox" id="agreeTerms" required>
                <label for="agreeTerms">I have read and agree to the <a href="terms.html" target="_blank">Terms & Conditions</a>.</label>
            </div>

            <button type="submit" class="btn">Create Account</button>
        </form>
        <a href="login.html" class="back-link">Already have an account? Login here</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDnCejfQcvxQjcb3JESNPvZJpGgwbZy9bY", authDomain: "novavest-58ae5.firebaseapp.com", databaseURL: "https://novavest-58ae5-default-rtdb.firebaseio.com/", projectId: "novavest-58ae5", storageBucket: "novavest-58ae5.firebasestorage.app", messagingSenderId: "596912273946", appId: "1:596912273946:web:50fdb479fbc088a9392fa3" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            
            // Check if the terms checkbox is checked
            if (!document.getElementById('agreeTerms').checked) {
                alert("You must agree to the Terms & Conditions to create an account.");
                return; // Stop the registration process
            }

            let name = document.getElementById('fullname').value;
            let email = document.getElementById('email').value;
            let password = document.getElementById('password').value;
            let safeEmail = email.replace(/\./g, ',');
            const urlParams = new URLSearchParams(window.location.search);
            let referrer = urlParams.get('ref') || "None";
            
            auth.createUserWithEmailAndPassword(email, password).then(() => {
                db.ref('users/' + safeEmail).set({ fullname: name, email: email, balance: 0, tier: "None", referredBy: referrer }).then(() => {
                    window.location.href = "dashboard.html";
                });
            }).catch((error) => alert("Error: " + error.message));
        });
    </script>
</body>
</html>
