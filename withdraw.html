<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaVest - Withdraw</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .glass-container { max-width: 450px; }
        .balance-display { text-align: center; font-size: 16px; margin-bottom: 15px; padding: 12px; background: rgba(0, 255, 157, 0.05); border: 1px solid rgba(0, 255, 157, 0.2); border-radius: 8px; color: var(--neon-main); font-weight: bold; }
        .min-text { font-size: 14px; color: var(--danger); text-align: center; margin-bottom: 20px; font-weight: 600; }
    </style>
</head>
<body style="padding: 20px;">
    <div class="logo">NovaVest</div>
    <div class="glass-container" style="padding: 30px;">
        <h2>Request Withdrawal</h2>
        <div class="balance-display">Available Balance: <span id="currentBalanceDisplay">₦0.00</span></div>
        <p class="min-text" id="minWithdrawText">* Calculating minimum withdrawal...</p>
        
        <form id="withdrawForm">
            <div class="form-group"><label>Amount to Withdraw (₦):</label><input type="number" id="amount" placeholder="Enter amount" required></div>
            <div class="form-group"><label>Bank Name:</label><input type="text" id="bank" placeholder="e.g. OPay, GTBank" required></div>
            <div class="form-group"><label>Account Number:</label><input type="text" id="accountNumber" placeholder="10-digit account number" required></div>
            <div class="form-group"><label>Account Name:</label><input type="text" id="accountName" placeholder="Enter your account name" required></div>
            <button type="submit" class="btn" style="margin-top: 10px;">Submit Withdrawal Request</button>
        </form>
        
        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDnCejfQcvxQjcb3JESNPvZJpGgwbZy9bY", authDomain: "novavest-58ae5.firebaseapp.com", databaseURL: "https://novavest-58ae5-default-rtdb.firebaseio.com/", projectId: "novavest-58ae5", storageBucket: "novavest-58ae5.firebasestorage.app", messagingSenderId: "596912273946", appId: "1:596912273946:web:50fdb479fbc088a9392fa3" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let currentBalance = 0, userTier = 0;

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = "login.html"; return; }
            let safeEmail = user.email.replace(/\./g, ',');
            db.ref('users/' + safeEmail).on('value', snap => {
                let data = snap.val();
                if(data) {
                    currentBalance = data.balance || 0; 
                    userTier = parseFloat(data.tier) || 0;
                    document.getElementById('currentBalanceDisplay').innerText = '₦' + currentBalance.toLocaleString();
                    
                    // UPDATED MATH: 3x the registration tier
                    let minWithdrawal = userTier * 3; 
                    document.getElementById('minWithdrawText').innerText = `* Minimum withdrawal is ₦${minWithdrawal.toLocaleString()}`;
                }
            });
        });

        document.getElementById('withdrawForm').addEventListener('submit', function(e) {
            e.preventDefault(); 
            let requestedAmount = parseFloat(document.getElementById('amount').value);
            
            // UPDATED MATH: 3x the registration tier
            let minWithdrawal = userTier * 3; 
            
            if (requestedAmount > currentBalance) { alert("Error: Insufficient balance."); } 
            else if (requestedAmount < minWithdrawal) { alert(`Error: Minimum withdrawal is ₦${minWithdrawal.toLocaleString()}.`); } 
            else {
                let user = auth.currentUser; let safeEmail = user.email.replace(/\./g, ',');
                db.ref('users/' + safeEmail).update({ balance: currentBalance - requestedAmount }).then(() => {
                    db.ref('withdrawals').push({ userEmail: user.email, userSafeEmail: safeEmail, amount: requestedAmount, bank: document.getElementById('bank').value, accNum: document.getElementById('accountNumber').value, accName: document.getElementById('accountName').value, status: "Pending" }).then(() => {
                        alert("Withdrawal Pending Admin Approval!");
                        window.location.href = "dashboard.html";
                    });
                });
            }
        });
    </script>
</body>
</html>
