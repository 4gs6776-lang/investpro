<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaVest - Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
    <div class="logo">NovaVest Admin</div>
    <div class="glass-container" style="padding: 30px; width: 100%; max-width: 400px;">
        <h2>Authorized Personnel Only</h2>
        <form id="adminLoginForm">
            <div class="form-group"><label>Admin Email</label><input type="text" id="adminId" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="adminPass" required></div>
            <button type="submit" class="btn">Secure Login</button>
        </form>
        <a href="index.html" class="back-link">← Back to Homepage</a>
    </div>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDnCejfQcvxQjcb3JESNPvZJpGgwbZy9bY", authDomain: "novavest-58ae5.firebaseapp.com", databaseURL: "https://novavest-58ae5-default-rtdb.firebaseio.com/", projectId: "novavest-58ae5", storageBucket: "novavest-58ae5.firebasestorage.app", messagingSenderId: "596912273946", appId: "1:596912273946:web:50fdb479fbc088a9392fa3" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let email = document.getElementById('adminId').value;
            let pass = document.getElementById('adminPass').value;
            
            // Log into Firebase Auth as the Admin
            auth.signInWithEmailAndPassword(email, pass).then(() => {
                window.location.href = "admin.html";
            }).catch(() => {
                alert("Access Denied! Invalid admin credentials.");
            });
        });
    </script>
</body>
</html>
