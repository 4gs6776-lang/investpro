<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaVest - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
    <div class="logo">NovaVest</div>
    <div class="glass-container" style="padding: 30px; width: 100%; max-width: 400px;">
        <h2>Welcome Back</h2>
        <form id="loginForm">
            <div class="form-group"><label>Email Address</label><input type="email" id="email" placeholder="e.g. john@example.com" required></div>
            <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Enter your password" required></div>
            <button type="submit" class="btn">Login to Dashboard</button>
        </form>
        <a href="register.html" class="back-link">Don't have an account? Register here</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDnCejfQcvxQjcb3JESNPvZJpGgwbZy9bY", authDomain: "novavest-58ae5.firebaseapp.com", databaseURL: "https://novavest-58ae5-default-rtdb.firebaseio.com/", projectId: "novavest-58ae5", storageBucket: "novavest-58ae5.firebasestorage.app", messagingSenderId: "596912273946", appId: "1:596912273946:web:50fdb479fbc088a9392fa3" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let email = document.getElementById('email').value;
            let password = document.getElementById('password').value;
            auth.signInWithEmailAndPassword(email, password).then(() => {
                window.location.href = "dashboard.html";
            }).catch(() => alert("Login failed! Check your email and password."));
        });
    </script>
</body>
</html>
