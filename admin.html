<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaVest - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        header { background: rgba(2, 17, 9, 0.6); backdrop-filter: blur(20px); padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 900px; margin: 0 auto 20px; padding: 20px; overflow-x: auto; }
        h2 { margin-bottom: 15px; color: var(--neon-main); border-left: 4px solid var(--neon-main); padding-left: 10px; font-size: 18px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th { background: rgba(0, 255, 157, 0.1); color: var(--neon-main); padding: 10px; text-align: left; font-size: 13px; border-bottom: 1px solid var(--glass-border); }
        td { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 10px; font-size: 13px; color: var(--text-main); }
        .btn-approve { background: var(--neon-main); color: #000; border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 12px; margin-bottom: 5px; }
        .btn-reject { background: rgba(255, 77, 77, 0.2); color: var(--danger); border: 1px solid rgba(255, 77, 77, 0.3); padding: 6px 10px; border-radius: 6px; cursor: pointer; font-weight: 700; font-size: 12px; }
        .empty-msg { text-align: center; color: var(--text-muted); font-style: italic; padding: 30px; }
        
        /* ROI Section Styles */
        .roi-section { text-align: center; margin-bottom: 20px; }
        .roi-btn { background: var(--gold-accent); color: #000; padding: 15px; border: none; border-radius: 8px; font-weight: 800; cursor: pointer; font-size: 16px; width: 100%; transition: 0.2s; margin-top: 10px; }
        .roi-btn:hover { box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); }
        .roi-btn:disabled { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); cursor: not-allowed; box-shadow: none; }
        .roi-info { color: var(--text-muted); font-size: 14px; margin-bottom: 10px; }
    </style>
</head>
<body style="padding: 15px;">
    <header>
        <div class="logo" style="margin:0;">NovaVest Admin Panel</div>
        <a href="admin-login.html" class="btn-logout">Logout</a>
    </header>

    <div class="glass-card container roi-section">
        <h2>Daily ROI Distribution</h2>
        <p class="roi-info">Click the button below once every day to automatically pay daily profits to all activated users.</p>
        <button class="roi-btn" id="roiBtn" onclick="processDailyROI()">Trigger Daily ROI Payout</button>
    </div>

    <div class="glass-card container">
        <h2>Pending Payment Verifications</h2>
        <table><thead><tr><th>User Name</th><th>Email</th><th>Amount Paid</th><th>Referred By</th><th>Action</th></tr></thead><tbody id="pendingPaymentsBody"></tbody></table>
    </div>

    <div class="glass-card container">
        <h2>Pending Withdrawal Requests</h2>
        <table><thead><tr><th>Amount</th><th>Bank</th><th>Acc Num</th><th>Acc Name</th><th>Action</th></tr></thead><tbody id="requestTableBody"></tbody></table>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('auth') !== 'success') { window.location.href = "admin-login.html"; }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDnCejfQcvxQjcb3JESNPvZJpGgwbZy9bY", authDomain: "novavest-58ae5.firebaseapp.com", databaseURL: "https://novavest-58ae5-default-rtdb.firebaseio.com/", projectId: "novavest-58ae5", storageBucket: "novavest-58ae5.firebasestorage.app", messagingSenderId: "596912273946", appId: "1:596912273946:web:50fdb479fbc088a9392fa3" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        db.ref('users').on('value', snap => {
            let users = snap.val(); let body = document.getElementById('pendingPaymentsBody'); body.innerHTML = ''; let has = false;
            for (let key in users) {
                let u = users[key];
                if (u.paymentStatus === "Pending") {
                    has = true; let ref = u.referredBy && u.referredBy !== "None" ? u.referredBy.replace(/,/g, '.') : "None";
                    body.innerHTML += `<tr><td>${u.fullname}</td><td>${u.email}</td><td style="font-weight:800;color:var(--neon-main);">₦${parseInt(u.requestedTier).toLocaleString()}</td><td>${ref}</td><td><button class="btn-approve" onclick="approvePayment('${key}', '${u.requestedTier}', '${u.referredBy}')">Approve</button></td></tr>`;
                }
            }
            if(!has) body.innerHTML = '<tr><td colspan="5" class="empty-msg">No pending payments.</td></tr>';
        });

        function approvePayment(emailKey, tierAmount, referrer) {
            db.ref('users/' + emailKey).once('value').then(snap => {
                let newBal = (snap.val().balance || 0) + parseInt(tierAmount);
                db.ref('users/' + emailKey).update({ tier: tierAmount, paymentStatus: "Approved", balance: newBal }).then(() => {
                    alert("Activated! Balance updated.");
                    
                    // UPDATED REFERRAL BONUS: Now ₦300
                    if (referrer && referrer !== "None") {
                        db.ref('users/' + referrer).once('value').then(rSnap => {
                            if(rSnap.val()) { 
                                db.ref('users/' + referrer).update({ balance: (rSnap.val().balance || 0) + 300 }).then(() => alert("Referral Bonus of ₦300 given to referrer!")); 
                            }
                        });
                    }
                });
            });
        }

        db.ref('withdrawals').on('value', snap => {
            let w = snap.val(); let body = document.getElementById('requestTableBody'); body.innerHTML = ''; let has = false;
            for (let key in w) {
                let r = w[key];
                if (r.status === "Pending") {
                    has = true;
                    body.innerHTML += `<tr><td style="font-weight:800;color:var(--neon-main);">₦${r.amount.toLocaleString()}</td><td>${r.bank}</td><td>${r.accNum}</td><td>${r.accName}</td><td><button class="btn-approve" onclick="approveW('${key}')">Approve</button><button class="btn-reject" onclick="rejectW('${key}', '${r.userSafeEmail}', ${r.amount})">Reject</button></td></tr>`;
                }
            }
            if(!has) body.innerHTML = '<tr><td colspan="5" class="empty-msg">No pending withdrawals.</td></tr>';
        });

        function approveW(k) { db.ref('withdrawals/' + k).remove().then(() => alert("Approved!")); }
        function rejectW(k, email, amt) { db.ref('users/' + email).once('value').then(s => { db.ref('users/' + email).update({ balance: (s.val().balance || 0) + amt }).then(() => { db.ref('withdrawals/' + k).remove().then(() => alert("Rejected! Money returned.")); }); }); }

        // DAILY ROI LOGIC
        function processDailyROI() {
            if (!confirm("Are you sure you want to trigger the Daily ROI Payout for ALL active users?")) return;
            
            let roiBtn = document.getElementById('roiBtn');
            roiBtn.disabled = true;
            roiBtn.innerText = "Processing Payouts...";

            db.ref('users').once('value').then(snap => {
                let users = snap.val();
                let updates = {};
                let processedCount = 0;

                for (let key in users) {
                    let u = users[key];
                    if (u.paymentStatus === "Approved" && u.tier && u.tier !== "None") {
                        let tierAmount = parseFloat(u.tier);
                        let roiPercentage = 0;

                        if (tierAmount >= 1000 && tierAmount <= 4000) roiPercentage = 0.05;      // 5%
                        else if (tierAmount >= 5000 && tierAmount <= 49000) roiPercentage = 0.08; // 8%
                        else if (tierAmount >= 50000) roiPercentage = 0.12;                       // 12%

                        let profit = tierAmount * roiPercentage;
                        let newBalance = (u.balance || 0) + profit;
                        
                        updates['users/' + key + '/balance'] = newBalance;
                        processedCount++;
                    }
                }

                db.ref().update(updates).then(() => {
                    alert("Success! Daily ROI has been paid to " + processedCount + " active users.");
                    roiBtn.disabled = false;
                    roiBtn.innerText = "Trigger Daily ROI Payout";
                });
            });
        }
    </script>
</body>
</html>
