<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaVest - Watch & Earn</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .glass-container { max-width: 450px; text-align: center; }
        .video-placeholder { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--glass-border); color: var(--neon-main); height: 200px; display: flex; align-items: center; justify-content: center; border-radius: 10px; margin-bottom: 20px; font-size: 20px; font-weight: bold; }
        .timer { font-size: 40px; font-weight: 800; color: var(--neon-main); margin-bottom: 20px; text-shadow: 0 0 15px var(--neon-glow); }
    </style>
</head>
<body style="padding: 20px;">
    <div class="logo">NovaVest</div>
    <div class="glass-container" style="padding: 30px;">
        <h2>Watch & Earn</h2>
        <div class="video-placeholder">🎬 Promotional Video Playing...</div>
        <p style="color: var(--text-muted); margin-bottom: 15px;">Please wait for the timer to finish to claim your reward.</p>
        <div class="timer" id="timerDisplay">10</div>
        <button id="claimBtn" class="btn" disabled style="opacity: 0.5;">Claim ₦50</button>
        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDnCejfQcvxQjcb3JESNPvZJpGgwbZy9bY", authDomain: "novavest-58ae5.firebaseapp.com", databaseURL: "https://novavest-58ae5-default-rtdb.firebaseio.com/", projectId: "novavest-58ae5", storageBucket: "novavest-58ae5.firebasestorage.app", messagingSenderId: "596912273946", appId: "1:596912273946:web:50fdb479fbc088a9392fa3" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        auth.onAuthStateChanged(user => { if (!user) window.location.href = "login.html"; });
        
        let timeLeft = 10;
        let claimBtn = document.getElementById('claimBtn');
        setInterval(() => {
            timeLeft--;
            document.getElementById('timerDisplay').innerText = timeLeft;
            if (timeLeft <= 0) { clearInterval(); document.getElementById('timerDisplay').innerText = "Done!"; claimBtn.disabled = false; claimBtn.style.opacity = 1; }
        }, 1000);

        claimBtn.addEventListener('click', function() {
            let user = auth.currentUser; if(user) {
                let safeEmail = user.email.replace(/\./g, ',');
                db.ref('users/' + safeEmail).once('value').then(snap => {
                    let newBalance = (snap.val().balance || 0) + 50;
                    db.ref('users/' + safeEmail).update({ balance: newBalance }).then(() => {
                        alert("Success! You earned ₦50.00");
                        window.location.href = "dashboard.html";
                    });
                });
            }
        });
    </script>
</body>
</html>
