<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaVest - Complete Payment</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #f4f8f6; color: #1a1a1a; margin: 0; padding: 20px; text-align: center; }
        header { text-align: center; margin-bottom: 20px; }
        .logo { font-size: 28px; font-weight: 800; color: #00a86b; }
        .container { max-width: 450px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 4px solid #00a86b; }
        
        select { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 8px; font-size: 16px; margin-bottom: 20px; color: #1a1a1a; background: white; cursor: pointer; }
        select:focus { border-color: #00a86b; outline: none; }

        .amount-box { background: #e6f7ef; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .amount-box h2 { margin: 0; color: #007a4d; font-size: 28px; }
        
        .bank-details { border: 2px dashed #00a86b; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: left; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .detail-row:last-child { margin-bottom: 0; }
        .detail-label { font-weight: 600; color: #666; }
        .copy-btn { background: #00a86b; border: none; color: white; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; }
        
        .timer-box { font-size: 32px; font-weight: 800; color: #dc3545; margin: 10px 0 20px; }
        .btn-confirm { width: 100%; background-color: #00a86b; color: white; padding: 15px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .btn-confirm:hover { background-color: #007a4d; }
        .btn-confirm:disabled { background-color: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>

    <header><div class="logo">NovaVest</div></header>

    <div class="container">
        <h2 style="margin-top:0;">Activate Your Account</h2>
        <p style="color:#666; margin-bottom: 20px;">Select an investment amount to activate your account and start earning daily ROI.</p>

        <!-- Dropdown for all Naira Amounts -->
        <select id="tierSelect" onchange="updateAmount()">
            <!-- Starter Plan (₦1,000 to ₦4,000) -->
            <optgroup label="Starter Plan (5% Daily)">
                <option value="1000">₦1,000</option>
                <option value="2000">₦2,000</option>
                <option value="3000">₦3,000</option>
                <option value="4000">₦4,000</option>
            </optgroup>
            
            <!-- Growth Plan (Starts from ₦5,000) -->
            <optgroup label="Growth Plan (8% Daily)">
                <option value="5000">₦5,000</option>
                <option value="10000">₦10,000</option>
                <option value="15000">₦15,000</option>
                <option value="20000">₦20,000</option>
            </optgroup>

            <!-- VIP Plan -->
            <optgroup label="VIP Plan (12% Daily)">
                <option value="50000">₦50,000 🏆</option>
            </optgroup>
        </select>

        <div class="amount-box">
            <p style="margin:0; color:#666; font-size:14px;">Amount to Transfer:</p>
            <h2 id="amountToPay">₦1,000</h2>
        </div>

        <div class="bank-details">
            <div class="detail-row">
                <span class="detail-label">Bank Name:</span>
                <span style="font-weight:700;">OPay</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Account Number:</span>
                <span style="font-weight:700;">648 712 6034</span>
                <button class="copy-btn" onclick="copyAccount()">Copy</button>
            </div>
            <div class="detail-row">
                <span class="detail-label">Account Name:</span>
                <span style="font-weight:700;">GOODNEWS LAWSON</span>
            </div>
        </div>

        <p style="color:#666; font-size:14px;">Time remaining to make payment:</p>
        <div class="timer-box" id="countdown">30:00</div>

        <button class="btn-confirm" id="confirmBtn" onclick="confirmPayment()">I have made this payment</button>
        
        <a href="dashboard.html" style="display:block; margin-top:15px; color:#00a86b; text-decoration:none; font-weight:600;">← Back to Dashboard</a>
    </div>

    <script>
        // Update the amount based on dropdown
        function updateAmount() {
            let select = document.getElementById('tierSelect');
            document.getElementById('amountToPay').innerText = '₦' + parseInt(select.value).toLocaleString();
        }
        updateAmount(); // Set initial amount

        // 30-minute countdown timer
        let timeLeft = 1800; 
        let timerDisplay = document.getElementById('countdown');
        let confirmBtn = document.getElementById('confirmBtn');

        let countdownInterval = setInterval(function() {
            timeLeft--;
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            timerDisplay.innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            if (timeLeft <= 0) {
                clearInterval(countdownInterval);
                timerDisplay.innerText = "Time Expired";
                timerDisplay.style.color = "#000";
                confirmBtn.disabled = true;
                alert("Time expired! Please go back to the dashboard to start again.");
            }
        }, 1000);

        function copyAccount() {
            navigator.clipboard.writeText("6487126034");
            alert("Account number copied to clipboard!");
        }

        function confirmPayment() {
            let selectedAmount = document.getElementById('tierSelect').value;
            localStorage.setItem('novavestTier', selectedAmount);
            alert("Thank you! Your payment of ₦" + parseInt(selectedAmount).toLocaleString() + " is now pending admin verification. You can proceed to your dashboard.");
            window.location.href = "dashboard.html";
        }
    </script>

</body>
</html>
