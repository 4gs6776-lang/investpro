<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaVest - Complete Payment</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .glass-container { max-width: 450px; margin: 0 auto; }
        p { color: var(--text-muted); text-align: center; margin-bottom: 20px; font-size: 14px; }
        .amount-box { background: rgba(0, 255, 157, 0.05); border: 1px solid rgba(0, 255, 157, 0.2); padding: 15px; border-radius: 10px; margin-bottom: 20px; text-align: center; }
        .amount-box h2 { margin: 0; color: var(--neon-main); font-size: 28px; }
        .bank-details { border: 1px solid var(--glass-border); padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: left; background: rgba(0, 0, 0, 0.2); }
        .detail-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .detail-row:last-child { margin-bottom: 0; }
        .copy-btn { background: var(--neon-main); border: none; color: #000; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: 800; font-size: 12px; }
        .timer-box { font-size: 32px; font-weight: 800; color: var(--danger); margin: 10px 0 20px; text-align: center; }
    </style>
</head>
<body style="padding: 20px;">
    <div class="logo">NovaVest</div>
    <div class="glass-container" style="padding: 30px;">
        <h2>Activate Your Account</h2>
        <p>Select an investment amount to start earning daily ROI.</p>
        <select id="tierSelect" onchange="updateAmount()">
            <optgroup label="Starter Plan (5% Daily)"><option value="1000">₦1,000</option><option value="2000">₦2,000</option><option value="3000">₦3,000</option><option value="4000">₦4,000</option></optgroup>
            <optgroup label="Growth Plan (8% Daily)"><option value="5000">₦5,000</option><option value="10000">₦10,000</option><option value="15000">₦15,000</option><option value="20000">₦20,000</option></optgroup>
            <optgroup label="VIP Plan (12% Daily)"><option value="50000">₦50,000 🏆</option></optgroup>
        </select>
        <div class="amount-box"><p style="margin:0; color:var(--text-muted); font-size:14px;">Amount to Transfer:</p><h2 id="amountToPay">₦1,000</h2></div>
        <div class="bank-details">
            <div class="detail-row"><span style="color:var(--text-muted);">Bank Name:</span> <span style="font-weight:700;">OPay</span></div>
            <div class="detail-row"><span style="color:var(--text-muted);">Account Number:</span> <span style="font-weight:700;">648 712 6034</span> <button class="copy-btn" onclick="copyAccount()">Copy</button></div>
            <div class="detail-row"><span style="color:var(--text-muted);">Account Name:</span> <span style="font-weight:700;">GOODNEWS LAWSON</span></div>
        </div>
        <p style="font-size:14px;">Time remaining to make payment:</p>
        <div class="timer-box" id="countdown">30:00</div>
        <button class="btn" id="confirmBtn" onclick="confirmPayment()">I have made this payment</button>
        <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
    </div>

    <!-- Added Firebase Auth Script here -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyDnCejfQcvxQjcb3JESNPvZJpGgwbZy9bY", authDomain: "novavest-58ae5.firebaseapp.com", databaseURL: "https://novavest-58ae5-default-rtdb.firebaseio.com/", projectId: "novavest-58ae5", storageBucket: "novavest-58ae5.firebasestorage.app", messagingSenderId: "596912273946", appId: "1:596912273946:web:50fdb479fbc088a9392fa3" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        function updateAmount() { document.getElementById('amountToPay').innerText = '₦' + parseInt(document.getElementById('tierSelect').value).toLocaleString(); }
        let timeLeft = 1800; let confirmBtn = document.getElementById('confirmBtn');
        setInterval(() => { timeLeft--; let m = Math.floor(timeLeft/60), s = timeLeft%60; document.getElementById('countdown').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; if(timeLeft<=0){ confirmBtn.disabled=true; confirmBtn.style.opacity=0.5; } }, 1000);
        function copyAccount() { navigator.clipboard.writeText("6487126034"); alert("Copied!"); }
        
        function confirmPayment() {
            let selectedAmount = document.getElementById('tierSelect').value;
            let user = firebase.auth().currentUser; // Get the actual logged in user
            
            if(!user) { 
                alert("Error: Please login first."); 
                window.location.href = "login.html"; 
                return; 
            }
            let safeEmail = user.email.replace(/\./g, ',');
            
            db.ref('users/' + safeEmail).update({
                paymentStatus: "Pending", 
                requestedTier: selectedAmount
            }).then(() => {
                alert("Thank you! Your payment is now PENDING admin verification. Please wait for approval.");
                window.location.href = "dashboard.html";
            }).catch((error) => {
                alert("Error: " + error.message);
            });
        }
    </script>
</body>
</html>
